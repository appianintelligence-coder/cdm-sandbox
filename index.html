<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDM Sandbox</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:linear-gradient(135deg,#F4F7F8 0%,#fff 50%,#F3F8F9 100%);color:#1a1a1a;min-height:100vh}
input,textarea,select,button{font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:0 0 0 2px #7FB4C2}
.top-bar{height:4px;background:#1F5162}
.gold-bar-top{height:2px;background:#7FB4C2}
.step-nav{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 8px;flex-wrap:wrap}
.step-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.step-btn.active{background:#1F5162;color:#fff;box-shadow:0 2px 10px rgba(153,0,0,.3);transform:scale(1.05)}
.step-btn.done{background:#D4E0E5;color:#1F5162}
.step-btn.pending{background:#ECEFF1;color:#999}
.card{background:#fff;border:1px solid #DDE5E8;border-radius:14px;padding:18px;margin-bottom:12px}
.card-accent{border:2px solid #1F5162}
.warm-bg{background:#F4F7F8}
.cream-bg{background:#EEF4F6}
.gold-left{border-left:3px solid #7FB4C2;background:#EEF4F6;padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.field label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#1F5162}
.field input,.field textarea,.field select{padding:8px 12px;border-radius:10px;border:1px solid #ddd;font-size:13px;background:#fff;transition:border .2s}
.field textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 10px;border-radius:12px;color:#fff;background:#1F5162}
.badge-gold{background:#7FB4C2;color:#1a1a1a}
.btn-p{background:#1F5162;color:#fff;border:none;padding:12px 28px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(153,0,0,.25)}
.btn-p:hover{transform:scale(1.03)}
.btn-s{background:transparent;border:2px dashed #ccc;padding:10px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer;color:#999;width:100%}
.btn-s:hover{background:#fff;border-color:#1F5162;color:#1F5162}
.btn-o{background:transparent;border:1px solid #1F5162;color:#1F5162;padding:8px 18px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer}
.btn-o:hover{background:#1F5162;color:#fff}
.ces-card{border-radius:12px;transition:all .25s;border:2px solid #D6DEE1;background:#F4F7F8;margin-bottom:10px}
.ces-card.ck{border-color:#1F5162;background:#fff;box-shadow:0 2px 12px rgba(153,0,0,.08)}
.ces-inner{display:flex;align-items:flex-start;gap:12px;padding:14px}
.mod-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mod-tab{padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.mod-tab.active{background:#1F5162;color:#fff;box-shadow:0 2px 8px rgba(153,0,0,.2)}
.mod-tab:not(.active){background:#ECEFF1;color:#888}
.obj-row{border-radius:12px;padding:16px;border:1px solid #DDE5E8;margin-bottom:10px}
.obj-row:nth-child(odd){background:#F4F7F8}
.obj-row:nth-child(even){background:#fff}
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid #e0e0e0;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.prog-track{width:100%;height:10px;border-radius:8px;background:#eee;overflow:hidden}
.prog-fill{height:100%;border-radius:8px;transition:width .4s}
.bloom-card{border-radius:10px;padding:10px;border:1px solid #e0e0e0;background:#fff}
.bloom-card.pri{border-color:#7FB4C2;background:#EEF4F6}
.stitle{font-size:22px;font-weight:900;color:#1F5162;margin-bottom:4px}
.ssub{font-size:11px;color:#999;margin-bottom:16px}
.content{padding-bottom:80px;max-width:900px;margin:0 auto;padding-left:16px;padding-right:16px}
.bullet-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;color:#444;line-height:1.5}
.bullet-dot{color:#1F5162;font-weight:900;font-size:16px;line-height:1.3}
.how-item{margin-bottom:12px}
.how-label{font-weight:700;color:#1F5162;font-size:13px}
.how-desc{font-size:12px;color:#555;line-height:1.5;margin-top:2px}
.tip-item{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
.tip-arrow{color:#7FB4C2;font-size:14px}
.tip-text{font-size:12px;color:#666;font-style:italic;line-height:1.5}
.msw-card{border-radius:10px;padding:10px;border:1px solid #ddd;background:#fff;transition:all .2s;cursor:pointer}
.msw-card.ck{border-color:#1F5162;background:#EFF5F7}
.msw-card .comp-name{font-size:10px;font-weight:700;color:#1F5162;margin-top:4px}
.msw-card .comp-desc{font-size:9px;color:#777;margin-top:2px;line-height:1.3}

/* Accessibility & sizing - 25% larger */
body{font-size:17px;line-height:1.6}
.field input,.field textarea,.field select{font-size:16px;padding:12px 16px;border-radius:12px}
.field label{font-size:13px;letter-spacing:.6px}
.field{margin-bottom:4px}
.stitle{font-size:30px;margin-bottom:8px}
.ssub{font-size:15px;margin-bottom:20px}
.badge{font-size:13px;padding:4px 14px;border-radius:14px}
.btn-p{padding:16px 36px;font-size:16px;border-radius:14px}
.btn-s{font-size:15px;padding:14px;border-radius:14px}
.btn-o{font-size:15px;padding:12px 24px;border-radius:12px}
.step-btn{font-size:13px;padding:10px 16px;border-radius:24px}
.card{padding:24px;border-radius:16px}
.bullet-item{font-size:16px;padding:6px 0}
.bullet-dot{font-size:20px}
.how-item{margin-bottom:16px}
.how-label{font-size:16px}
.how-desc{font-size:15px;line-height:1.6}
.tip-text{font-size:15px}
.tip-item{padding:6px 0}
.ces-card{border-radius:14px}
.ces-inner{padding:18px}
.ces-inner p{font-size:15px}
.msw-card{border-radius:12px;padding:14px}
.msw-card .comp-name{font-size:13px;margin-top:6px}
.msw-card .comp-desc{font-size:12px;margin-top:4px;line-height:1.4}
.obj-row{padding:22px;border-radius:14px}
.gold-left{padding:16px 20px;font-size:15px;border-radius:0 12px 12px 0}
.content{max-width:1060px;padding-left:24px;padding-right:24px}
.g2{gap:16px}.g3{gap:16px}.g4{gap:16px}
.mod-tabs{gap:10px}
.mod-tab{font-size:14px;padding:12px 22px;border-radius:12px}
.bot-nav{padding:14px 24px}
.step-nav{padding:14px 12px;gap:6px}
.card-accent{border-radius:16px}

/* Admin Dashboard styles */
.admin-badge{display:inline-block;font-size:11px;font-weight:700;color:#1F5162;background:#EEF5F7;padding:2px 10px;border-radius:10px}

/* Version & Comments styles */
.ver-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;background:#1F5162;color:#fff}
.ver-badge.locked{background:#888}
.comment-bubble{background:#fff;border:1px solid #DDE5E8;border-radius:12px;padding:14px;margin-bottom:10px}
.comment-meta{font-size:12px;color:#888;margin-bottom:6px}
.comment-role{font-size:10px;font-weight:700;padding:1px 8px;border-radius:8px;display:inline-block;margin-left:6px}
.comment-role.admin{background:#EEF5F7;color:#1F5162}
.comment-role.faculty{background:#f0fdf4;color:#166534}
.comment-text{font-size:14px;color:#333;line-height:1.5}
.comment-section{font-size:11px;color:#1F5162;font-weight:600;margin-bottom:4px}
.ver-timeline{display:flex;flex-direction:column;gap:8px}
.ver-card{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border:1px solid #DDE5E8;border-radius:12px;cursor:pointer;transition:all .2s}
.ver-card:hover{border-color:#1F5162;box-shadow:0 2px 8px rgba(153,0,0,.1)}
.ver-card.current{border:2px solid #1F5162;background:#F3F8F9}
</style>
</head>

// ============================================================================
// OFFLINE PERSISTENCE (durability safety net)
// Enable IndexedDB-backed offline persistence so that any write made while the
// connection is dropped is QUEUED on the faculty member's device and AUTOMATICALLY
// synced to the server the moment the connection returns — even if they reload or
// reopen the tab in between. This is the automatic counterpart to the localStorage
// backup: localStorage protects the data; persistence makes the actual save
// complete itself without the user having to do anything.
//
// SAFETY: this MUST run before any Firestore read/write. It is wrapped so that if
// the browser does not support it (private mode, old browser) the app simply falls
// back to the in-memory cache and keeps working — it never crashes. synchronizeTabs
// lets multiple open tabs share one persistent cache safely.
//
// IMPORTANT: enabling persistence does NOT change save-status semantics. A write's
// promise still resolves only when the SERVER confirms it, so the green "All changes
// saved" badge continues to mean a true server-acknowledged save, never just a local
// write. While offline, the write stays pending (status remains "Saving") and the
// localStorage backup holds the work until the server confirms.
try{
  firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(function(err){
    // failed-precondition: multiple tabs without shared support. unimplemented: browser unsupported.
    // Either way we continue safely on the in-memory cache.
    console.warn("Offline persistence not enabled (continuing on in-memory cache):",err&&err.code?err.code:err);
  });
}catch(e){
  console.warn("Offline persistence setup skipped (continuing on in-memory cache):",e);
}



</script>

// =====================================================================
// MSW Course-to-Sub-Competency Mapping
// =====================================================================
// Maps course numbers to year and required sub-competencies.
// Sandbox: empty sample mapping; add entries as needed.
const MSW_COURSE_MAP={};

// Helper: Given a course number string (e.g. "DEMO 101"), return the
// year and resolved sub-competency objects (with full text). Returns
// null if the course is not in the mapping (treat as elective).
function getMSWMapping(courseNum){
  if(!courseNum)return null;
  // Normalize: extract just the course code from inputs like "DEMO 101: Course Title"
  var m=courseNum.match(/^([A-Za-z]{2,6}\s+\d+[a-z]?)/i);
  var key=m?m[1].toUpperCase().replace(/\s+/g," "):courseNum;
  var entry=MSW_COURSE_MAP[key];
  if(!entry)return null;
  var resolved=entry.subcomps.map(function(id){
    var sc=MSW_SUBCOMPS[id];
    if(!sc)return null;
    return {id:id,comp:sc.comp,text:entry.year===2?sc.spec:sc.gen};
  }).filter(function(x){return x;});
  return {year:entry.year,courseKey:key,subcomps:resolved};
}

// Debug helper exposed on window for verification in browser console.
// Run: verifyMSWMapping() in DevTools to print a table showing every
// mapped course, its year, sub-competency count, and whether the course
// is present in COURSE_CATALOG.
if(typeof window!=="undefined"){
  window.verifyMSWMapping=function(){
    var out=[];
    Object.keys(MSW_COURSE_MAP).forEach(function(k){
      var m=MSW_COURSE_MAP[k];
      var validRefs=m.subcomps.every(function(id){return MSW_SUBCOMPS[id];});
      out.push({course:k,year:m.year,subcompCount:m.subcomps.length,subcomps:m.subcomps.join(","),inCatalog:typeof COURSE_CATALOG!=="undefined"&&!!COURSE_CATALOG[k],allRefsValid:validRefs});
    });
    console.table(out);
    var missing=out.filter(function(r){return !r.inCatalog;}).map(function(r){return r.course;});
    if(missing.length){console.warn("Courses in MSW_COURSE_MAP but missing from COURSE_CATALOG:",missing);}
    var subcompTotal=Object.keys(MSW_SUBCOMPS).length;
    console.log("MSW_SUBCOMPS contains "+subcompTotal+" sub-competencies (expected: 22).");
    return out;
  };
}

function loadAllFaculty(cb){
  // Use collectionGroup so we find every "courses" subcollection across every
  // user, even when the parent cdm_data/{uid} document was never written
  // (that's the default with this app's schema and was why the admin dashboard
  // appeared empty previously).
  var db=firebase.firestore();
  // Kick off BOTH queries in parallel: collectionGroup for courses, and
  // cdm_data parent collection for profile docs (email/name/lastActive).
  // Merging the two lets us resolve faculty names for users whose courses
  // were saved before the userEmail/userName fields were added to saves.
  Promise.all([
    db.collectionGroup("courses").get(),
    db.collection("cdm_data").get().catch(function(){return {forEach:function(){}};})
  ]).then(function(results){
    var snap=results[0];
    var profiles=results[1];
    var byUid={};
    // First pass: seed from profile docs (authoritative for name/email)
    profiles.forEach(function(pDoc){
      var p=pDoc.data();
      byUid[pDoc.id]={uid:pDoc.id,email:p.email||"",name:p.name||"",courses:[]};
    });
    // Second pass: attach courses, fill in profile info if missing
    snap.forEach(function(cDoc){
      if(!cDoc.ref.parent||!cDoc.ref.parent.parent)return; // safety
      var uid=cDoc.ref.parent.parent.id;
      var d=cDoc.data();
      if(!byUid[uid]){byUid[uid]={uid:uid,email:d.userEmail||"",name:d.userName||"",courses:[]};}
      if(!byUid[uid].email&&d.userEmail)byUid[uid].email=d.userEmail;
      if(!byUid[uid].name&&d.userName)byUid[uid].name=d.userName;
      byUid[uid].courses.push({
        id:cDoc.id,
        name:d.courseName||"Untitled",
        leadName:d.leadName||"",
        lastUpdated:d.lastUpdated,
        cdmStatus:d.cdmStatus||"Draft",
        cdmVersion:d.cdmVersion||"1.0",
        program:d.program||"dsw",
        userEmail:d.userEmail||"",
        userName:d.userName||"",
        archived:d.archived===true,
        archivedAt:d.archivedAt||null,
        archivedBy:d.archivedBy||""
      });
    });
    // Drop profile-only entries that have no courses (users who signed in but never saved)
    var faculty=Object.keys(byUid).map(function(k){return byUid[k];}).filter(function(f){return f.courses.length>0;});
    faculty.forEach(function(f){
      f.courses.sort(function(a,b){
        var at=(a.lastUpdated&&a.lastUpdated.toMillis)?a.lastUpdated.toMillis():0;
        var bt=(b.lastUpdated&&b.lastUpdated.toMillis)?b.lastUpdated.toMillis():0;
        return bt-at;
      });
    });
    faculty.sort(function(a,b){
      // Put unknowns last so admin can see named faculty first
      var an=a.name||"zzz_Unknown";
      var bn=b.name||"zzz_Unknown";
      return an.localeCompare(bn);
    });
    cb(faculty);
  }).catch(function(e){
    console.error("Admin load error:",e);
    alert("Could not load faculty data. If you just deployed this fix, check that your Firestore security rules allow collectionGroup reads on 'courses' for admin emails. Error: "+e.message);
    cb([]);
  });
}

// ===== VERSION COMPARISON (READ-ONLY) =====
// Given two version snapshots, computes what changed between them, with friendly labels.
// Pure/read-only: it only reads snapshots and never writes, so it cannot alter or lose data.
// Unit-tested in isolation before wiring in. Modules are matched by stable id, so reordering
// a module is NOT flagged as a change; whitespace-only edits are ignored; internal fields hidden.
function cdmNorm(x){return (x==null?"":String(x)).trim();}
function cdmFlatten(obj,prefix,out){
  out=out||{};
  if(obj==null){if(prefix)out[prefix]="";return out;}
  if(Array.isArray(obj)){obj.forEach(function(it,i){var k=(it&&typeof it==="object"&&it.id!=null)?("#"+it.id):("["+i+"]");cdmFlatten(it,prefix+"/"+k,out);});return out;}
  if(typeof obj==="object"){Object.keys(obj).forEach(function(k){cdmFlatten(obj[k],prefix?prefix+"/"+k:k,out);});return out;}
  out[prefix]=obj;return out;
}

// Save the course CDM and WAIT for the server acknowledgment, with automatic retry.
// onStatus(state) is called with "saving", "saved", or "error" so the UI can show
// the real save state instead of a fake "Saved" badge. Returns a Promise that
// resolves true on confirmed server write, false if all retries failed.
// This is the core safeguard against silent data loss: we never claim "saved"
// unless the server actually acknowledged the write.
function save(d,cid,onStatus){
  var u=firebase.auth().currentUser;
  if(!u||!cid){return Promise.resolve(false);}
  var db=firebase.firestore();
  var payload={cdmData:JSON.stringify(d),courseName:d.courseName||"Untitled",cdmVersion:d.cdmVersion||"1.0",program:d.program||"dsw",cdmStatus:d.cdmStatus||"Draft",targetDelivery:d.targetDelivery||"",leadName:d.courseLead||"",userEmail:u.email,userName:u.displayName,lastUpdated:firebase.firestore.FieldValue.serverTimestamp()};
  if(onStatus)onStatus("saving");
  // Best-effort profile upsert (non-critical, does not affect save status).
  db.collection("cdm_data").doc(u.uid).set({uid:u.uid,email:u.email||"",name:u.displayName||"",lastActive:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(e){console.error("Profile upsert:",e);});
  var ref=db.collection("cdm_data").doc(u.uid).collection("courses").doc(cid);
  var attempts=0,maxAttempts=4;
  function tryWrite(){
    attempts++;
    return ref.set(payload,{merge:true}).then(function(){
      // CRITICAL: ref.set() resolving is NOT proof the SERVER has the data. With
      // offline persistence enabled, the write can resolve once it is committed to
      // the local device cache while the server copy is still pending. If we reported
      // "saved" here, the badge would go green and the app would clear the on-device
      // backup before the data ever reached the server — exactly the silent-loss path.
      //
      // waitForPendingWrites() resolves ONLY when the backend has acknowledged every
      // pending write. So we wait for it before declaring "saved". While offline this
      // stays pending (badge never goes green), and once the connection returns and the
      // server confirms, it resolves and we report a true, server-backed save.
      var confirm=(typeof db.waitForPendingWrites==="function")?db.waitForPendingWrites():Promise.resolve();
      return confirm.then(function(){
        if(onStatus)onStatus("saved");
        return true;
      });
    }).catch(function(e){
      console.error("Save attempt "+attempts+" failed:",e);
      if(attempts<maxAttempts){
        if(onStatus)onStatus("saving");
        return new Promise(function(res){setTimeout(res,Math.min(1000*attempts,4000));}).then(tryWrite);
      }
      if(onStatus)onStatus("error");
      return false;
    });
  }
  return tryWrite();
}

// ============================================================================
// LAYER 1: LOCAL BROWSER BACKUP (localStorage)
// Mirrors every change to the user's own browser so work survives even a total
// loss of connection to the server. All access is wrapped in try/catch so the app
// never breaks if localStorage is unavailable (private mode, full quota, etc.).
// ============================================================================
function backupKey(uid,cid){return "cdm_backup_"+uid+"_"+cid;}

// Write a local backup of the current CDM. Best-effort: failures are logged, never thrown.
function writeLocalBackup(uid,cid,d){
  if(!uid||!cid)return false;
  try{
    var rec={cdmData:JSON.stringify(d),courseName:d.courseName||"Untitled",cdmVersion:d.cdmVersion||"1.0",savedAt:Date.now()};
    window.localStorage.setItem(backupKey(uid,cid),JSON.stringify(rec));
    return true;
  }catch(e){console.error("Local backup write failed:",e);return false;}
}

// Read the local backup for a course. Returns {data, savedAt, courseName, cdmVersion} or null.
function readLocalBackup(uid,cid){
  if(!uid||!cid)return null;
  try{
    var raw=window.localStorage.getItem(backupKey(uid,cid));
    if(!raw)return null;
    var rec=JSON.parse(raw);
    if(!rec||!rec.cdmData)return null;
    var parsed=JSON.parse(rec.cdmData);
    return {data:parsed,savedAt:rec.savedAt||0,courseName:rec.courseName||"",cdmVersion:rec.cdmVersion||"1.0"};
  }catch(e){console.error("Local backup read failed:",e);return null;}
}

// Remove the local backup once the server copy is confirmed current.
function clearLocalBackup(uid,cid){
  if(!uid||!cid)return;
  try{window.localStorage.removeItem(backupKey(uid,cid));}catch(e){console.error("Local backup clear failed:",e);}
}

// ============================================================================
// LAYER 4: OFF-PLATFORM DOWNLOAD BACKUP
// Exports the full CDM as a timestamped JSON file the faculty member can keep on
// their own computer or OneDrive. A true off-platform copy: survives even if the
// server, account, or browser storage is unavailable.
// ============================================================================
function downloadBackup(d){
  try{
    var stamp=new Date();
    var pad=function(n){return (n<10?"0":"")+n;};
    var ts=stamp.getFullYear()+"-"+pad(stamp.getMonth()+1)+"-"+pad(stamp.getDate())+"_"+pad(stamp.getHours())+pad(stamp.getMinutes());
    var safeName=(d.courseName||"CDM").replace(/[^a-zA-Z0-9_\- ]/g,"").replace(/\s+/g,"_").substring(0,60);
    var wrapper={
      _type:"CDM_Sandbox_Backup",
      _version:1,
      exportedAt:stamp.toISOString(),
      courseName:d.courseName||"Untitled",
      cdmVersion:d.cdmVersion||"1.0",
      program:d.program||"",
      cdm:d
    };
    var blob=new Blob([JSON.stringify(wrapper,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;
    a.download="CDM_Backup_"+(safeName||"course")+"_"+ts+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    return true;
  }catch(e){console.error("Download backup failed:",e);alert("Could not generate the backup file. Please try again.");return false;}
}

// ============================================================================
// LAYER 4 (restore side): LOAD A DOWNLOADED BACKUP BACK IN
// Reads a CDM backup file the faculty member previously downloaded and hands back
// its CDM content. Validates the file so a wrong, corrupt, or unrelated file is
// rejected cleanly rather than loading bad data into a course.
// ============================================================================
function parseBackupFile(file,onDone){
  try{
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var obj=JSON.parse(reader.result);
        var cdm=null,meta={};
        if(obj&&obj._type==="CDM_Sandbox_Backup"&&obj.cdm){cdm=obj.cdm;meta={courseName:obj.courseName,exportedAt:obj.exportedAt,cdmVersion:obj.cdmVersion};}
        else if(obj&&Array.isArray(obj.modules)){cdm=obj;meta={courseName:obj.courseName};}
        if(!cdm||!Array.isArray(cdm.modules)){onDone(null,"This file doesn't look like a CDM backup. Please choose a file you downloaded with the Backup button.");return;}
        onDone({cdm:cdm,meta:meta},null);
      }catch(e){onDone(null,"Could not read this file. Please choose a valid CDM backup (.json).");}
    };
    reader.onerror=function(){onDone(null,"Could not read this file. Please try again.");};
    reader.readAsText(file);
  }catch(e){onDone(null,"Could not read this file. Please try again.");}
}
